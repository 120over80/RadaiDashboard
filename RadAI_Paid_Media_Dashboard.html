<style>
:root{
  --navy:#0A1A2F;
  --navy-light:#122943;
  --white:#FFFFFF;
  --soft:#F5F7FA;
  --border:#E3E8EF;
  --body:#4A4A4A;
  --blue:#3A7AFE;
  --cyan:#00C6FF;
  --good:#22C55E;
  --bad:#F0506E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--navy);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--body);
  min-height:100vh;
}
a{color:var(--blue);}

/* ---------- Top bar ---------- */
.topbar{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);
  padding:18px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,0.25);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{height:32px;display:block;}
.brand .titles{display:flex;flex-direction:column;line-height:1.25;}
.brand .titles .t1{color:#fff;font-weight:700;font-size:16px;letter-spacing:.2px;}
.brand .titles .t2{color:#9FB3CC;font-size:12px;}
.platform-tabs{display:flex;gap:6px;background:rgba(255,255,255,0.06);padding:4px;border-radius:10px;}
.platform-tabs button{
  border:none;background:transparent;color:#C7D4E6;padding:8px 16px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s ease;white-space:nowrap;
}
.platform-tabs button.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(58,122,254,0.5);}
.platform-tabs button:hover:not(.active){background:rgba(255,255,255,0.1);color:#fff;}

/* ---------- Controls bar ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:22px 24px 60px;}
.controls-card{
  background:var(--white);
  border-radius:14px;
  padding:16px 22px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(10,26,47,0.08), 0 8px 24px rgba(10,26,47,0.06);
  margin-bottom:22px;
}
.ctrl-label{font-size:11px;font-weight:700;letter-spacing:.6px;color:#8A94A6;text-transform:uppercase;}
.date-field{display:flex;align-items:center;gap:8px;}
.date-field input[type=date]{
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px;color:var(--navy);
  font-family:inherit;background:var(--soft);
}
.reset-link{background:none;border:none;color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;}
.reset-link:hover{text-decoration:underline;}
.divider{width:1px;height:26px;background:var(--border);}
.cohort-toggle{display:flex;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
.cohort-toggle button{
  border:none;background:transparent;padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:700;
  color:#5C6B82;cursor:pointer;transition:.15s ease;
}
.cohort-toggle button.active{background:var(--navy);color:#fff;}
.google-note{
  margin-left:auto;font-size:12.5px;color:#8A94A6;background:var(--soft);border:1px dashed var(--border);
  padding:7px 12px;border-radius:8px;display:none;
}
.google-note.show{display:block;}

/* ---------- Section titles ---------- */
.section-title{color:#fff;font-size:15px;font-weight:700;margin:28px 0 14px;display:flex;align-items:center;gap:10px;}
.section-title .accent-bar{width:4px;height:16px;background:linear-gradient(180deg,var(--blue),var(--cyan));border-radius:2px;}
.section-sub{color:#9FB3CC;font-size:12.5px;font-weight:400;margin-left:2px;}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
.kpi-card{
  background:var(--white);border-radius:14px;padding:18px 20px;
  box-shadow:0 1px 3px rgba(10,26,47,0.08), 0 8px 24px rgba(10,26,47,0.06);
  position:relative;overflow:hidden;
}
.kpi-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.kpi-label{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:#8A94A6;text-transform:uppercase;margin-bottom:8px;}
.kpi-value{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1;}
.kpi-sub{font-size:12px;color:#8A94A6;margin-top:6px;}

/* ---------- Charts ---------- */
.charts-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px;}
.chart-card{
  background:var(--white);border-radius:14px;padding:18px 20px 10px;
  box-shadow:0 1px 3px rgba(10,26,47,0.08), 0 8px 24px rgba(10,26,47,0.06);
}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
.chart-title{font-size:14px;font-weight:700;color:var(--navy);}
.chart-hint{font-size:11px;color:#8A94A6;}
.chart-box{position:relative;height:360px;}

/* ---------- Tables ---------- */
.table-card{
  background:var(--white);border-radius:14px;padding:18px 20px;margin-top:16px;
  box-shadow:0 1px 3px rgba(10,26,47,0.08), 0 8px 24px rgba(10,26,47,0.06);
  overflow-x:auto;
}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;padding:9px 10px;color:#8A94A6;font-size:11px;text-transform:uppercase;
  letter-spacing:.4px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;
}
thead th:hover{color:var(--blue);}
tbody td{padding:10px 10px;border-bottom:1px solid var(--soft);color:var(--body);white-space:nowrap;}
tbody tr:hover{background:var(--soft);}
.name-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--navy);white-space:nowrap;}
.bar-cell{position:relative;min-width:140px;}
.bar-track{background:var(--soft);border-radius:5px;height:8px;width:120px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:5px;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- Placeholder ---------- */
.placeholder-card{
  background:var(--soft);border:1.5px dashed var(--border);border-radius:14px;padding:36px 24px;
  text-align:center;color:#5C6B82;font-size:13.5px;line-height:1.6;
}
.placeholder-card b{color:var(--navy);}
.placeholder-card code{background:#fff;border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-size:12px;}

footer{
  background:var(--navy);color:#7E8FA8;text-align:center;padding:22px 20px;font-size:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}
footer b{color:#C7D4E6;}

.hidden{display:none !important;}
</style>
</head>

Chart.register(ChartDataLabels);
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";

const COLORS = { blue:'#3A7AFE', cyan:'#00C6FF', navy:'#0A1A2F', body:'#4A4A4A', border:'#E3E8EF', soft:'#F5F7FA' };
const PLATFORM_COLORS = { linkedin: '#3A7AFE', google: '#FF9F43' };

const state = {
  platform: 'combined',
  cohort: 'weekly',
  startDate: DATA.meta.linkedinDateMin,
  endDate: DATA.meta.linkedinDateMax,
};

const fmtMoney = (v) => '$' + Number(v).toLocaleString('en-US', {maximumFractionDigits: v>=1000?0:2, minimumFractionDigits: v>=1000?0:2});
const fmtMoneyShort = (v) => v>=1000 ? '$'+(v/1000).toFixed(1).replace(/\.0$/,'')+'K' : '$'+Number(v).toFixed(v<20?2:0);
const fmtNum = (v) => Number(v).toLocaleString('en-US');
const fmtNumShort = (v) => v>=1000 ? (v/1000).toFixed(1).replace(/\.0$/,'')+'K' : String(Math.round(v));
const fmtPct = (v) => Number(v).toFixed(2) + '%';

let charts = {};

function filteredRows(platform){
  const rows = DATA[platform][state.cohort];
  return rows.filter(r => r.date >= state.startDate && r.date <= state.endDate);
}

function sumRows(rows, key){ return rows.reduce((a,r)=>a+r[key],0); }

function computeTotals(rows){
  const spend = sumRows(rows,'spend');
  const impressions = sumRows(rows,'impressions');
  const clicks = sumRows(rows,'clicks');
  const clicksToLP = sumRows(rows,'clicksToLP');
  const conversions = sumRows(rows,'conversions');
  const ctr = impressions>0 ? clicks/impressions*100 : 0;
  const cpLPClick = clicksToLP>0 ? spend/clicksToLP : 0;
  const costPerConv = conversions>0 ? spend/conversions : 0;
  return {spend,impressions,clicks,clicksToLP,ctr,cpLPClick,conversions,costPerConv};
}

const EMPTY_ROW = {spend:0,impressions:0,clicks:0,clicksToLP:0,ctr:0,cpLPClick:0,conversions:0,costPerConv:0};

function combinedRows(){
  const li = DATA.linkedin[state.cohort];
  const g = DATA.google[state.cohort];
  return li.map((r,i) => {
    const gr = g[i] || EMPTY_ROW;
    const spend = r.spend + gr.spend;
    const impressions = r.impressions + gr.impressions;
    const clicks = r.clicks + gr.clicks;
    const clicksToLP = r.clicksToLP + gr.clicksToLP;
    const conversions = (r.conversions||0) + (gr.conversions||0);
    return {
      date: r.date, label: r.label,
      spend, impressions, clicks, clicksToLP, conversions,
      ctr: impressions>0 ? clicks/impressions*100 : 0,
      cpLPClick: clicksToLP>0 ? spend/clicksToLP : 0,
      costPerConv: conversions>0 ? spend/conversions : 0,
    };
  }).filter(r => r.date >= state.startDate && r.date <= state.endDate);
}

function combinedSplitRows(){
  const li = DATA.linkedin[state.cohort];
  const g = DATA.google[state.cohort];
  const merged = li.map((r,i) => ({ date:r.date, label:r.label, li:r, google: g[i] || EMPTY_ROW }));
  return merged.filter(r => r.date >= state.startDate && r.date <= state.endDate);
}

function renderKPIs(){
  const grid = document.getElementById('kpiGrid');
  let totals, rangeLabel;

  if(state.platform === 'linkedin'){
    totals = computeTotals(filteredRows('linkedin'));
    rangeLabel = `(${state.startDate} &rarr; ${state.endDate})`;
  } else if(state.platform === 'google'){
    totals = computeTotals(filteredRows('google'));
    rangeLabel = `(${state.startDate} &rarr; ${state.endDate})`;
  } else {
    totals = computeTotals(combinedRows());
    rangeLabel = `(${state.startDate} &rarr; ${state.endDate})`;
  }
  document.getElementById('kpiRangeLabel').innerHTML = rangeLabel;

  const cards = [
    {label:'Total Spend', value: fmtMoney(totals.spend), sub:'across active campaigns'},
    {label:'Clicks to LP', value: fmtNum(totals.clicksToLP), sub:'landing page clicks'},
    {label:'Cost per LP Click', value: fmtMoney(totals.cpLPClick), sub:'spend ÷ LP clicks'},
    {label:'Impressions', value: fmtNum(totals.impressions), sub:'total ad views'},
    {label:'CTR', value: fmtPct(totals.ctr), sub:'clicks ÷ impressions'},
    {label:'Conversions', value: fmtNum(totals.conversions), sub:'tracked conversions'},
    {label:'Cost / Conversion', value: fmtMoney(totals.costPerConv), sub:'spend ÷ conversions'},
  ];
  grid.innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}</div>
      <div class="kpi-sub">${c.sub}</div>
    </div>`).join('');
}

function destroyCharts(){
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

// Alternate a little extra offset on every other point so consecutive close-value
// labels stagger into two rows instead of smearing into one another.
function staggerOffset(base, dense){
  if(!dense) return base;
  return (ctx) => base + (ctx.dataIndex % 2 === 1 ? 10 : 0);
}

function baseOptions(labelCount, formatter, opts={}){
  const showLabels = labelCount <= 60;
  const dense = labelCount > 12;
  const labelRotation = dense ? -45 : 0;
  return {
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top: dense ? 40 : 26, bottom: opts.line && dense ? 24 : 0}},
    interaction:{mode:'index', intersect:false},
    plugins:{
      legend:{display: !!opts.legend, position:'bottom', labels:{boxWidth:10,font:{size:11}}},
      tooltip:{
        backgroundColor:'#0A1A2F', padding:10, titleFont:{size:12}, bodyFont:{size:12},
        callbacks:{ label: (ctx)=> ` ${ctx.dataset.label}: ${formatter(ctx.parsed.y)}` }
      },
      datalabels: showLabels ? {
        color: opts.labelColor || '#0A1A2F',
        anchor:'end', align:'top', offset: staggerOffset(dense ? 6 : 3, dense), clamp:true,
        rotation: labelRotation,
        font:{size: dense ? 10 : 11.5, weight:'700'},
        formatter: (v)=> (v===0 || v===null || v===undefined) ? '' : formatter(v),
        display: (ctx)=>{
          const v = ctx.dataset.data[ctx.dataIndex];
          return v !== 0 && v !== null && v !== undefined;
        },
        backgroundColor: opts.line ? 'rgba(255,255,255,0.9)' : null,
        borderRadius: 4,
        padding: opts.line ? {top:2,bottom:2,left:4,right:4} : {top:0,bottom:0,left:1,right:1},
      } : {display:false}
    },
    scales:{
      x:{ stacked: !!opts.stacked, grid:{display:false}, ticks:{ color:'#8A94A6', font:{size:10.5}, maxRotation: labelCount>15?60:0, autoSkip:true, maxTicksLimit: labelCount>60?24:undefined } },
      y:{ stacked: !!opts.stacked, grid:{color:'#F0F2F5'}, ticks:{ color:'#8A94A6', font:{size:10.5}, callback:(v)=>formatter(v) }, beginAtZero:true }
    }
  };
}

// Per-dataset datalabels config for a platform segment inside a STACKED bar chart
// (label sits centered inside the colored segment, on a light chip for legibility).
// Segments too short to legibly hold text are skipped entirely (rely on tooltip instead
// of cramming rotated text into a sliver — this was the main source of overlap before).
function stackedBarLabels(labelCount, formatter, color){
  const showLabels = labelCount <= 60;
  if(!showLabels) return {display:false};
  const dense = labelCount > 12;
  return {
    display:(ctx)=>{
      const v = ctx.dataset.data[ctx.dataIndex];
      if(v === 0 || v === null || v === undefined) return false;
      try{
        const meta = ctx.chart.getDatasetMeta(ctx.datasetIndex);
        const el = meta.data[ctx.dataIndex];
        const h = el && (el.height ?? (el.base!=null && el.y!=null ? Math.abs(el.base - el.y) : null));
        if(h != null && h < 15) return false;
      }catch(e){}
      return true;
    },
    anchor:'center', align:'center', clamp:true,
    color: color, font:{size: dense ? 9.5 : 11, weight:'700'}, rotation: 0,
    formatter: (v)=> (v===0 || v===null || v===undefined) ? '' : formatter(v),
    backgroundColor:'rgba(255,255,255,0.92)', borderRadius:4, padding:{top:1,bottom:1,left:3,right:3},
  };
}

// Per-dataset datalabels config for one line in a two-line (LinkedIn vs Google) combined chart.
// `side` pushes one line's labels above and the other below to keep them from colliding,
// and consecutive points on the same line stagger further via staggerOffset.
function splitLineLabels(labelCount, formatter, color, side){
  const showLabels = labelCount <= 60;
  if(!showLabels) return {display:false};
  const dense = labelCount > 12;
  const sign = side === 'bottom' ? -1 : 1;
  return {
    display:(ctx)=>{ const v = ctx.dataset.data[ctx.dataIndex]; return v !== 0 && v !== null && v !== undefined; },
    anchor: side, align: side,
    offset: dense ? (ctx) => 6 + (ctx.dataIndex % 2 === 1 ? 9 : 0) : 4,
    clamp:true,
    color: color, font:{size: dense ? 9.5 : 11, weight:'700'}, rotation: dense ? -45 : 0,
    formatter: (v)=> (v===0 || v===null || v===undefined) ? '' : formatter(v),
    backgroundColor:'rgba(255,255,255,0.9)', borderRadius:4, padding:{top:1,bottom:1,left:3,right:3},
  };
}

function renderCharts(){
  destroyCharts();

  const isCombined = state.platform === 'combined';

  if(isCombined){
    const split = combinedSplitRows();
    const labels = split.map(r=>r.label);
    const n = labels.length;
    const MAX_LABELS = 60;
    document.getElementById('trendHint').textContent = n>MAX_LABELS ? `(data labels hidden above ${MAX_LABELS} points — hover for exact values)` : '';
    ['hintSpend','hintCpc','hintClicks','hintImpr','hintCtr','hintConv','hintCostConv'].forEach(id=>{
      document.getElementById(id).textContent = state.cohort.charAt(0).toUpperCase()+state.cohort.slice(1)+' view · LinkedIn vs Google';
    });

    const liColor = PLATFORM_COLORS.linkedin, gColor = PLATFORM_COLORS.google;

    function stackedBarChart(canvasId, key, formatter){
      const oLI = baseOptions(n, formatter, {stacked:true, legend:true});
      oLI.plugins.datalabels = stackedBarLabels(n, formatter, '#0A1A2F');
      return new Chart(document.getElementById(canvasId), {
        type:'bar',
        data:{ labels, datasets:[
          { label:'LinkedIn', data: split.map(r=>r.li[key]), backgroundColor: liColor, borderRadius:4, maxBarThickness:34, stack:'s',
            datalabels: stackedBarLabels(n, formatter, liColor) },
          { label:'Google', data: split.map(r=>r.google[key]), backgroundColor: gColor, borderRadius:4, maxBarThickness:34, stack:'s',
            datalabels: stackedBarLabels(n, formatter, '#B85C00') },
        ]},
        options: oLI
      });
    }

    // dualAxis: give LinkedIn and Google independent y-scales when their magnitudes
    // are too far apart to share one axis legibly (e.g. LinkedIn CPC $27 avg vs Google CPC $3 avg).
    function splitLineChart(canvasId, key, formatter, dualAxis){
      const o = baseOptions(n, formatter, {line:true, legend:true});
      if(dualAxis){
        o.scales.y.position = 'left';
        o.scales.y.title = {display:true, text:'LinkedIn', color:liColor, font:{size:10.5,weight:'700'}};
        o.scales.y1 = { position:'right', grid:{display:false}, ticks:{ color: gColor, font:{size:10.5}, callback:(v)=>formatter(v) }, beginAtZero:true, title:{display:true, text:'Google', color:gColor, font:{size:10.5,weight:'700'}} };
      }
      return new Chart(document.getElementById(canvasId), {
        type:'line',
        data:{ labels, datasets:[
          { label:'LinkedIn', data: split.map(r=>r.li[key]), borderColor: liColor, backgroundColor:'rgba(58,122,254,0.08)', fill:true, tension:.3, pointRadius:n>40?0:3, pointBackgroundColor:liColor, borderWidth:2.5, yAxisID:'y',
            datalabels: splitLineLabels(n, formatter, liColor, 'top') },
          { label:'Google', data: split.map(r=>r.google[key]), borderColor: gColor, backgroundColor:'rgba(255,159,67,0.08)', fill:true, tension:.3, pointRadius:n>40?0:3, pointBackgroundColor:gColor, borderWidth:2.5, yAxisID: dualAxis ? 'y1' : 'y',
            datalabels: splitLineLabels(n, formatter, '#B85C00', 'bottom') },
        ]},
        options: o
      });
    }

    charts.spend = stackedBarChart('chartSpend', 'spend', fmtMoneyShort);
    charts.cpc = splitLineChart('chartCpc', 'cpLPClick', fmtMoneyShort, true);
    charts.clicks = stackedBarChart('chartClicks', 'clicksToLP', fmtNumShort);
    charts.impr = stackedBarChart('chartImpr', 'impressions', fmtNumShort);
    charts.ctr = splitLineChart('chartCtr', 'ctr', fmtPct);
    charts.conv = stackedBarChart('chartConv', 'conversions', fmtNumShort);
    charts.costConv = splitLineChart('chartCostConv', 'costPerConv', fmtMoneyShort, true);
    return;
  }

  const rows = filteredRows(state.platform);
  const labels = rows.map(r=>r.label);
  const n = labels.length;
  const MAX_LABELS = 60;
  document.getElementById('trendHint').textContent = n>MAX_LABELS ? `(data labels hidden above ${MAX_LABELS} points — hover for exact values)` : '';
  ['hintSpend','hintCpc','hintClicks','hintImpr','hintCtr','hintConv','hintCostConv'].forEach(id=>{
    document.getElementById(id).textContent = state.cohort.charAt(0).toUpperCase()+state.cohort.slice(1)+' view';
  });

  charts.spend = new Chart(document.getElementById('chartSpend'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Spend', data: rows.map(r=>r.spend), backgroundColor: COLORS.blue, borderRadius:5, maxBarThickness:34 }]},
    options: baseOptions(n, fmtMoneyShort)
  });

  charts.cpc = new Chart(document.getElementById('chartCpc'), {
    type:'line',
    data:{ labels, datasets:[{ label:'Cost / LP Click', data: rows.map(r=>r.cpLPClick), borderColor: COLORS.cyan, backgroundColor:'rgba(0,198,255,0.12)', fill:true, tension:.3, pointRadius: n>40?0:3, pointBackgroundColor:COLORS.cyan, borderWidth:2.5 }]},
    options: baseOptions(n, fmtMoneyShort, {line:true})
  });

  charts.clicks = new Chart(document.getElementById('chartClicks'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Clicks to LP', data: rows.map(r=>r.clicksToLP), backgroundColor: '#1E4FD6', borderRadius:5, maxBarThickness:34 }]},
    options: baseOptions(n, fmtNumShort)
  });

  charts.impr = new Chart(document.getElementById('chartImpr'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Impressions', data: rows.map(r=>r.impressions), backgroundColor:'#B9CBEA', borderRadius:5, maxBarThickness:34 }]},
    options: baseOptions(n, fmtNumShort, {labelColor:'#3A5A8A'})
  });

  charts.ctr = new Chart(document.getElementById('chartCtr'), {
    type:'line',
    data:{ labels, datasets:[{ label:'CTR %', data: rows.map(r=>r.ctr), borderColor:'#F0506E', backgroundColor:'rgba(240,80,110,0.10)', fill:true, tension:.3, pointRadius: n>40?0:3, pointBackgroundColor:'#F0506E', borderWidth:2.5 }]},
    options: (()=>{ const o = baseOptions(n, fmtPct, {line:true}); o.plugins.datalabels.color = '#F0506E'; return o; })()
  });

  charts.conv = new Chart(document.getElementById('chartConv'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'Conversions', data: rows.map(r=>r.conversions||0), backgroundColor: '#22A97A', borderRadius:5, maxBarThickness:34 }]},
    options: (()=>{ const o = baseOptions(n, fmtNumShort); o.plugins.datalabels.color = '#0F6B4C'; return o; })()
  });

  charts.costConv = new Chart(document.getElementById('chartCostConv'), {
    type:'line',
    data:{ labels, datasets:[{ label:'Cost / Conversion', data: rows.map(r=>r.costPerConv||0), borderColor:'#8B5CF6', backgroundColor:'rgba(139,92,246,0.10)', fill:true, tension:.3, pointRadius: n>40?0:3, pointBackgroundColor:'#8B5CF6', borderWidth:2.5 }]},
    options: (()=>{ const o = baseOptions(n, fmtMoneyShort, {line:true}); o.plugins.datalabels.color = '#8B5CF6'; return o; })()
  });
}

function renderTable(tbodyId, theadId, rows, columns){
  const thead = document.querySelector(`#${theadId} tr`);
  thead.innerHTML = columns.map(c=>`<th data-key="${c.key}">${c.label}</th>`).join('');
  const tbody = document.getElementById(tbodyId);
  const maxVal = Math.max(...rows.map(r=>r[columns[1].key]||0), 1);
  tbody.innerHTML = rows.map(r => `
    <tr>
      ${columns.map((c,i)=>{
        const v = r[c.key];
        if(c.bar){
          const pct = Math.max(2, (v/maxVal)*100);
          return `<td class="bar-cell num"><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>${c.fmt(v)}</td>`;
        }
        if(i===0) return `<td class="name-cell" title="${v}">${v}</td>`;
        return `<td class="num">${c.fmt ? c.fmt(v) : v}</td>`;
      }).join('')}
    </tr>`).join('');
}

function renderCampaignSection(){
  const section = document.getElementById('campaignSection');
  const extra = document.getElementById('googleExtraTables');
  extra.innerHTML = '';
  const titleEl = document.getElementById('campaignSectionTitle');

  if(state.platform !== 'combined'){
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');

  titleEl.innerHTML = '<span class="accent-bar"></span>Platform Comparison <span class="section-sub">(selected date range)</span>';
  const li = computeTotals(filteredRows('linkedin'));
  const g = computeTotals(filteredRows('google'));
  const rows = [
    {name:'LinkedIn Ads', spend: li.spend, impressions: li.impressions, clicks: li.clicks, clicksToLP: li.clicksToLP, ctr: li.ctr, cpLPClick: li.cpLPClick, conversions: li.conversions, costPerConv: li.costPerConv},
    {name:'Google Ads', spend: g.spend, impressions: g.impressions, clicks: g.clicks, clicksToLP: g.clicksToLP, ctr: g.ctr, cpLPClick: g.cpLPClick, conversions: g.conversions, costPerConv: g.costPerConv},
  ];
  renderTable('campaignTable', 'campaignTable', rows, [
    {key:'name', label:'Platform'},
    {key:'spend', label:'Spend', bar:true, fmt:fmtMoney},
    {key:'impressions', label:'Impressions', fmt:fmtNum},
    {key:'clicks', label:'Clicks', fmt:fmtNum},
    {key:'clicksToLP', label:'Clicks to LP', fmt:fmtNum},
    {key:'ctr', label:'CTR', fmt:fmtPct},
    {key:'cpLPClick', label:'Cost / LP Click', fmt:fmtMoney},
    {key:'conversions', label:'Conversions', fmt:fmtNum},
    {key:'costPerConv', label:'Cost / Conversion', fmt:fmtMoney},
  ]);
}

function renderAll(){
  renderKPIs();
  renderCharts();
  renderCampaignSection();
}

// ---------- controls wiring ----------
document.getElementById('startDate').value = state.startDate;
document.getElementById('endDate').value = state.endDate;
document.getElementById('startDate').min = DATA.meta.linkedinDateMin;
document.getElementById('endDate').max = DATA.meta.linkedinDateMax;

document.getElementById('startDate').addEventListener('change', e=>{ state.startDate = e.target.value; renderAll(); });
document.getElementById('endDate').addEventListener('change', e=>{ state.endDate = e.target.value; renderAll(); });
document.getElementById('resetYTD').addEventListener('click', ()=>{
  state.startDate = DATA.meta.linkedinDateMin; state.endDate = DATA.meta.linkedinDateMax;
  document.getElementById('startDate').value = state.startDate;
  document.getElementById('endDate').value = state.endDate;
  renderAll();
});
document.querySelectorAll('#cohortToggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#cohortToggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cohort = btn.dataset.cohort;
    renderAll();
  });
});
document.querySelectorAll('#platformTabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#platformTabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.platform = btn.dataset.platform;
    renderAll();
  });
});

// sortable tables (basic)
document.addEventListener('click', (e)=>{
  const th = e.target.closest('th[data-key]');
  if(!th) return;
});

document.getElementById('footerText').textContent =
  `Data as of ${DATA.meta.asOf} · LinkedIn data: daily, ${DATA.meta.linkedinRealDataStart}–${DATA.meta.linkedinDateMax} · Google data: daily, ${DATA.meta.googleRealDataStart}–${DATA.meta.googleDateMax}`;

renderAll();
</script>
